# ============================================================================
# Scope Configuration
# ============================================================================
# Controls which HTTP records are in scope for scanning.
# Each rule has include and exclude lists. All rules use AND logic:
# a record must pass every rule to be in scope. Exclude takes priority
# over include (if a record matches both, it is excluded).
#
# Pattern types vary by field:
#   host, path, content-type  — glob patterns (case-insensitive)
#   status_code               — exact ("200"), wildcard ("2xx", "2*"), range ("400-499")
#   request_string, response_string — case-insensitive substring match
#
# Defaults: include ["*"] and exclude [] for host, path, status_code,
# and content-types. String rules default to include [] (empty = match all).
#
# Manage at runtime with: vigolium scope / vigolium scope set
scope:
  # When true, scope rules are also enforced during ingestion: out-of-scope
  # requests are rejected before being saved to the database.
  # When false (default), all requests are saved but out-of-scope records
  # are skipped during scanning.
  applied_on_ingest: false

  # CLI origin mode restricts which hosts are in scope based on CLI target origins.
  # This provides automatic host restriction from the -t target URL(s).
  #
  # Modes (example target: http://www.example.com):
  #   "balanced" — host must share the target's eTLD+1 (e.g. example.com) (default);
  #                matches *.example.com but not examplesite.com
  #   "all"      — no origin restriction
  #   "relaxed"  — host must contain the target's keyword (e.g. "example");
  #                matches examplesite.com, test-example.net, etc. Note this
  #                admits every brand domain on every TLD, which in practice
  #                means an organization's SSO/IdP and marketing estate — use it
  #                for deliberate brand-wide recon, not for scanning one app.
  #   "strict"   — host must exactly match the target host;
  #                only www.example.com passes
  #
  # IP targets always use exact match regardless of mode.
  # Override with CLI flag: --scope-origin <mode>
  # Left commented out so the built-in default governs; uncomment to pin a mode.
  # Default: balanced
  # cli_origin_mode: balanced

  # Maximum request body size in bytes. Bodies exceeding this limit are
  # handled according to body_size_exceeded_action.
  # 0 means unlimited. Default: 1048576 (1 MB)
  max_request_body_size: 1048576

  # Maximum response body size in bytes. Bodies exceeding this limit are
  # handled according to body_size_exceeded_action.
  # 0 means unlimited. Default: 524288000 (500 MB)
  max_response_body_size: 524288000

  # Action when body size exceeds the limit:
  #   "truncate"  — truncate body to the limit, save and scan (default)
  #   "drop"      — discard the item entirely (no save, no scan)
  #   "skip-scan" — save truncated body to DB but skip scanning modules
  body_size_exceeded_action: truncate

  # Automatically skip URLs whose path ends with a known static-asset
  # extension (images, fonts, video, audio, etc.).
  # This reduces noise and improves scan performance out of the box.
  # Default: true
  ignore_static_file: true

  # Categories of static file extensions to ignore when ignore_static_file
  # is enabled. Each key is a category name; values are lists of extensions
  # (case-insensitive, leading dot required). Add or remove entries to
  # customize which file types are skipped.
  ignore_static_content_type:
    fonts: [".ttf", ".otf", ".woff", ".woff2", ".eot", ".pfa", ".pfb", ".fnt", ".bdf", ".psf", ".snf", ".otc", ".ttc", ".afm", ".pfm"]
    images: [".jpg", ".jpeg", ".png", ".gif", ".bmp", ".tif", ".tiff", ".webp", ".avif", ".heic", ".heif", ".ico", ".cur", ".psd", ".raw", ".cr2", ".nef", ".arw", ".dng"]
    vector_images: [".ai", ".eps", ".cdr"]
    video: [".mp4", ".m4v", ".mov", ".avi", ".wmv", ".flv", ".webm", ".mkv", ".3gp", ".3g2", ".mpeg", ".mpg", ".m2ts", ".ogv", ".vob", ".rm", ".rmvb"]
    audio: [".mp3", ".wav", ".ogg", ".aac", ".flac", ".m4a", ".wma", ".mid", ".midi", ".amr", ".aiff"]

  # Host patterns (glob, case-insensitive)
  host:
    include:
      - "*"
    exclude: []
    # Example: scan only example.com and its subdomains, skip staging:
    # include:
    #   - "*.example.com"
    #   - "example.com"
    # exclude:
    #   - "staging.example.com"

  # URL path patterns (glob, case-insensitive)
  path:
    include:
      - "*"
    exclude: []
    # Example: scan only /api paths, skip health checks:
    # include:
    #   - "/api/*"
    # exclude:
    #   - "/api/health"
    #   - "/api/metrics"

  # HTTP status code filters
  # Supports exact ("200"), wildcard ("2xx"), and range ("400-499")
  status_code:
    include:
      - "*"
    exclude: []
    # Example: only scan responses with 2xx and 3xx status codes:
    # include:
    #   - "2xx"
    #   - "3xx"

  # Request Content-Type patterns (glob)
  request_content_type:
    include:
      - "*"
    exclude: []
    # Example: only scan JSON and form requests:
    # include:
    #   - "application/json*"
    #   - "application/x-www-form-urlencoded*"

  # Response Content-Type patterns (glob)
  response_content_type:
    include:
      - "*"
    exclude: []
    # Example: only scan HTML and JSON responses, skip images:
    # include:
    #   - "text/html*"
    #   - "application/json*"
    # exclude:
    #   - "image/*"

  # Request body/header substring match (case-insensitive)
  # Empty include = match all requests
  request_string:
    include: []
    exclude: []
    # Example: skip requests containing a specific auth token:
    # exclude:
    #   - "X-Internal-Service-Key"

  # Response body/header substring match (case-insensitive)
  # Empty include = match all responses
  response_string:
    include: []
    exclude: []
    # Example: skip responses containing "not found" boilerplate:
    # exclude:
    #   - "page not found"
    #   - "404 error"

# ============================================================================
# Content Discovery (Deparos)
# ============================================================================
# Configure deparos content discovery, which brute-forces directories and files
# on a target web server before vulnerability scanning begins.
# Managed by scanning_strategy; override with CLI flags: --discover, --discover-max-time
# Speed control (concurrency, max_duration) is configured in scanning_pace.discovery.
discovery:
  # Discovery mode: what types of resources to discover.
  # Options: "files_and_dirs", "files_only", "dirs_only"
  # Default: files_and_dirs
  mode: files_and_dirs

  # Scope mode for discovered URLs.
  # Options:
  #   "subdomain" - same registered domain (eTLD+1)
  #   "exact"     - exact hostname match only
  #   "any"       - no host restriction
  # Default: subdomain
  scope_mode: subdomain

  # Save HTTP response bodies from discovery into the ephemeral DB.
  # When true, response data is available for scanning modules.
  # Default: true
  save_response_body: true

  # Enrich discovery targets with paths from previous phases (spidering, external harvest).
  # When true, discovered paths are used to expand the brute-force target list.
  # When false, only the original seed URLs are used as discovery targets.
  # Default: false
  enrich_targets: false

  # Harvest words from response bodies into the observed-name wordlist so they
  # are brute-forced as path names. Unset = on at --intensity deep, off
  # otherwise; true/false force it.
  # extract_words: true

  # Enable malformed path probing during directory discovery.
  # When true, uses the fuzz wordlist (fuzz_wordlist_path) to test directories
  # with path traversal and malformed path payloads (e.g., ..;/, .%00/, %2e%2e/).
  # Default: false
  enable_malformed_path_probe: false

  # How many targets are discovered at once. Targets on the same host:port
  # never run together, and the discovery engine threads
  # (scanning_pace.discovery.concurrency) are split across the targets in
  # flight: max(5, threads / active). discovery rate_limit applies per target.
  # 0 = default (min(number of targets, 3)); 1 = one target at a time.
  target_concurrency: 0

  # How often a running target's results are saved and handed to the scan,
  # instead of waiting for the target to finish (also after every 500 new
  # discoveries). Covers JS-, form- and API-spec-derived requests and, with
  # stream_fuzz, the wordlist/fuzz results.
  # "0" = only when the target finishes. Default: 15s
  flush_interval: 15s

  # Stream wordlist/fuzz results with every flush too. Duplicates keep the
  # first record seen and the near-identical cap (dedup_cluster_cap) keeps the
  # first N of each cluster, so a killed scan keeps what was flushed. false =
  # save them when the target finishes (duplicates keep the shorter path, the
  # cap keeps the shortest paths). Default: true
  stream_fuzz: true

  # Recursion settings for directory traversal.
  recursion:
    # Enable recursive directory discovery.
    # Default: true
    enabled: true

    # Maximum recursion depth (1-32767).
    # Default: 5
    max_depth: 5

  # Wordlist paths for discovery.
  # Empty path = use the embedded default for that slot. Supports ~ expansion.
  wordlists:
    # Which embedded dir/file lists fill the "long" slot when long_file_path /
    # long_dir_path are unset. The short lists always run.
    #   short — short lists only (a few hundred entries)
    #   long  — adds dir-long.txt / file-long.txt (~5k entries each)
    #   large — adds dir-large.txt / file-large.txt (~9.3k each: the long lists
    #           plus the bare words of fuzz.txt, deduplicated)
    #   auto  — derive from --intensity: deep → large; quick and balanced → short
    # A curated larger list can be bundled by dropping dir-large.txt.gz /
    # file-large.txt.gz into internal/resources/wordlists (gzip-embedded).
    # Default: auto
    tier: auto

    # short_file_path: ~/.vigolium/wordlists/file-short.txt
    # long_file_path: ~/.vigolium/wordlists/file-long.txt
    # short_dir_path: ~/.vigolium/wordlists/dir-short.txt
    # long_dir_path: ~/.vigolium/wordlists/dir-long.txt
    # fuzz_wordlist_path: ~/.vigolium/wordlists/fuzz.txt
    # (--discovery-wordlist replaces fuzz_wordlist_path; repeat it to stream
    # several files in order, each word tried once.)

    # Use filenames observed during spidering as wordlist entries.
    # Default: true
    use_observed_names: true

    # Use observed directory paths as wordlist entries.
    # Default: true
    use_observed_paths: true

    # Test full observed filenames (e.g., "app.b5ca88ec.js").
    # Default: true
    use_observed_files: true

    # Enable numeric variant generation (e.g., page1 → page2, page3).
    # Default: false
    enable_numeric_fuzzing: false

  # File extension testing during discovery.
  extensions:
    # Test custom extensions (php, asp, aspx, jsp, etc.).
    # Default: true
    test_custom: true

    # Custom extension list (used when test_custom is true).
    # Default: deparos built-in list (php, asp, aspx, jsp, jspa, do)
    # custom_list:
    #   - php
    #   - asp
    #   - aspx

    # Test extensions observed during spidering.
    # Default: true
    test_observed: true

    # Test backup extensions (.bak, .old, .tmp, etc.).
    # Default: true
    test_backup_extensions: true

    # Custom backup variant list (used when test_backup_extensions is true).
    # Each entry is a template over the discovered file: {f} = full name
    # (admin.php), {n} = name without extension (admin), {e} = extension (php).
    # A bare suffix without placeholders means "{f}.<suffix>" (admin.php.bak).
    # Default: ~40 built-in templates ({f}~, {f}.bak, {n}.bak, .{f}.swp, {n}_old.{e}, ...)
    # backup_extensions:
    #   - "{f}~"
    #   - "{n}.bak"
    #   - old

    # Test files without extensions.
    # Default: true
    test_no_extension: true

  # Discovery engine settings.
  engine:
    # Case sensitivity mode for filename matching.
    # Options: "auto_detect", "sensitive", "insensitive"
    # Default: auto_detect
    case_sensitivity: auto_detect

    # HTTP request timeout per discovery request.
    # Must be 1s-300s.
    # Default: 10s
    timeout: 10s

    # Custom HTTP headers to include in all discovery requests.
    # custom_headers:
    #   Authorization: "Bearer my-token"
    #   X-Custom-Header: "value"

    # Enable cookie jar for session persistence during discovery.
    # Default: false
    enable_cookie_jar: false

    # Exit after N consecutive network errors (0 = disabled).
    # Default: 0
    max_consecutive_errors: 50

    # Exit after N consecutive WAF/CDN blocks (0 = disabled).
    # Default: 0
    max_consecutive_waf_blocks: 50

    # Max items per observed provider.
    # Default: 4000
    observed_max_items: 4000

    # Disable native secret scanning during discovery.
    # Default: true
    disable_secret_scan: true

    # Wire protocol for discovery traffic, pinned per origin: auto (HTTP/3 when
    # a direct QUIC handshake proves it, else HTTP/2 when TLS ALPN selects it,
    # else HTTP/1.1), http1, http2, or http3. HTTP/3 is never used through a
    # proxy. The module scanner always uses HTTP/1.1.
    # Default: auto
    protocol: auto

    # Workers per target for wordlist and FUZZ-template requests. The rest of
    # discovery (spider, observed-word variants, JS) keeps the phase
    # concurrency. 0 = scanning_pace.max_per_host (or the phase concurrency
    # when -c is given explicitly).
    # Default: 0
    brute_force_concurrency: 0

  # Embedded JavaScript intelligence and source-aware replay.
  jstangle:
    # Store typed facts and analyze scripts. Default: true.
    enabled: true

    # exact: high-confidence facts only; conservative: also medium; off: metadata only.
    replay_mode: exact

    # Which recovered requests are SAFE to actually send during discovery
    # (orthogonal to replay_mode's confidence gate). Withheld templates are still
    # recorded, just not auto-replayed.
    #   metadata-only  — send nothing
    #   read-only      — GET/HEAD/OPTIONS + GraphQL queries (default)
    #   safe-baseline  — read-only + idempotent writes (PUT/DELETE)
    #   state-changing — all methods + GraphQL mutations (opt-in)
    replay_safety: read-only

    # Follow bounded source maps and chunk/worker/manifest references.
    source_maps: true
    asset_graph: true

    # Attempt controlled WebSocket/SSE GET handshakes. Off by default.
    protocol_handshake: false

    # 0 derives the worker count: clamp(CPUs/2, 2, memory_budget_mb/384), max 8.
    # The worker pool is shared by the whole process; a discovery that asks for
    # more workers or memory than it is running with grows it (never shrinks).
    worker_count: 0
    # 0 derives the budget from usable RAM: min(2048, max(768, RAM/8)) MiB.
    memory_budget_mb: 0
    cache_mb: 128
    worker_max_jobs: 100
    worker_max_rss_mb: 1024
    job_timeout: 60s

    # Tiered input policy: normal -> discovery-lite -> lexical fallback -> reject.
    # Must satisfy normal <= max_ast <= max_unpack <= hard.
    normal_input_mb: 1
    max_ast_input_mb: 4
    # Above max_ast, beautify/inspect still unminify and unpack (no AST) up to
    # this ceiling. 0 follows hard_input_mb.
    max_unpack_input_mb: 16
    # Larger scripts are skipped and counted as js_input_over_hard_limit.
    hard_input_mb: 16
    max_requests_per_file: 500
    max_ast_nodes: 500000

    # Recursive JavaScript asset graph budgets.
    max_asset_depth: 4
    max_assets_per_parent: 64
    max_assets_per_host: 512
    max_assets_total: 2048
    # Lazy chunks a bundle's loader runtime names (webpack chunk maps, Vite
    # preload deps, template imports over a literal map) use this per-bundle
    # budget instead of max_assets_per_parent. 0 = 512.
    max_chunks_per_runtime: 512

    # JS-derived requests the crawl did not confirm (404/soft-404 replays,
    # medium-confidence or withheld templates) are still stored as
    # source=jstangle http_records with jstangle:* remarks, so later phases and
    # read commands see every endpoint the bundle references.
    # Also store templates that were never sent (withheld by replay_mode or
    # replay_safety, deduped, unresolved). Default: true.
    persist_unreplayed: true
    # Not-found replay statuses that still prove the route exists; these stubs
    # are handed to later phases, every other stub is stored only.
    # Default: [400, 405, 415, 422]
    persist_not_found_emit_statuses: [400, 405, 415, 422]
    # Per-target cap on stored templates; past it the run reports the
    # js_template_persist_cap limit. 0 = default (2000).
    max_persisted_js_templates: 2000

  # Sitemap source. At discovery start, fetch the sitemaps robots.txt names (or
  # probe /sitemap.xml and /sitemap_index.xml when it names none). XML urlset,
  # sitemapindex, gzip (.gz or 1f8b magic, 50 MiB decompressed cap with a bomb
  # guard) and plain-text sitemaps are streamed. Every in-scope <loc> path feeds
  # the observed-path wordlist; a path-shape sample of them is spidered.
  sitemap:
    # Default: true
    enabled: true
    # Sampled URLs spidered per target, round-robin over path shapes. Past it the
    # run reports the sitemap_cap limit. 0 = default (2000).
    max_urls: 2000
    # Sampled URLs per host + path shape (/product/{int} is one shape).
    # 0 = default (3).
    per_shape: 3
    # Fetch <sitemapindex> children (depth <= 2, <= 16 children per index).
    # Default: true
    follow_index: true

# ============================================================================
# Browser-Based Spidering (Spitolas)
# ============================================================================
# Configure browser-based crawling to discover dynamic content, SPAs,
# and API endpoints that static crawlers miss. Uses headless Chromium
# to interact with pages (click elements, fill forms, trigger JS).
#
# Managed by scanning_strategy; override with CLI flags: --spider, --spider-max-time
# Speed control (max_duration) is configured in scanning_pace.spidering.
spidering:
  # Maximum crawl depth (0 = unlimited).
  # Bounds how far from the seed the crawl follows links. Without a bound, a
  # link-dense site can spend the whole max_duration deep inside one branch and
  # never come back to the breadth near the seed.
  # Default: 6
  max_depth: 6

  # Maximum number of unique states to discover (0 = unlimited).
  # Stops a template that mints a fresh state per row (a paginated table, a
  # calendar) from consuming the budget on near-identical pages.
  # Default: 1500
  max_states: 1500

  # Maximum duration for spidering per target.
  # Format: duration string (e.g., "30m", "1h")
  # Default: 30m
  max_duration: 30m

  # Maximum consecutive action failures before aborting.
  # Default: 100
  max_consecutive_fails: 100

  # Run browser in headless mode (no visible window).
  # Default: true
  headless: true

  # Browser instances to launch. The crawler drives one browser, so values
  # above 1 are clamped to 1 (with a warning) and add no speed; use tabs below
  # to crawl in parallel inside that browser.
  # Default: 1
  browser_count: 1

  # Tabs of the browser that crawl the shared state graph at once (1-16). Each
  # tab claims a state, reaches it and fires its actions while the others work
  # elsewhere; the crawl ends when nothing is queued and no tab is busy. Every
  # tab costs roughly 80-150 MB. Stays 1 at every intensity until a multi-tab
  # soak has passed.
  # Default: 1
  tabs: 1

  # How the tabs share browser state. "shared": one cookie jar and storage, so
  # a logout fired in one tab logs the others out. "context": each extra tab
  # gets a browser context of its own, seeded with the configured auth and the
  # first tab's cookies (more memory, no shared session warmth).
  # Default: shared
  tab_isolation: shared

  # Crawl strategy for state exploration.
  # Options: "normal", "random", "oldest_first", "shallow_first", "adaptive"
  # Default: adaptive
  strategy: adaptive

  # Include HTTP response bodies in captured traffic.
  # Default: true
  include_response_body: true

  # Browser engine to use.
  # Options: "chromium" (default), "ungoogled" (Linux only)
  # Default: chromium
  browser_engine: chromium

  # Drop the browser's automation markers: the enable-automation switch,
  # navigator.webdriver, an empty plugin list, a "HeadlessChrome" client-hint
  # brand (Sec-CH-UA / navigator.userAgentData) and similar trivial checks. This
  # reduces false negatives where a simple bot wall serves the crawler a
  # challenge page instead of the application. It is not bot-detection evasion:
  # anything that fingerprints harder still sees an automated browser.
  # Also applies to module browser confirmations (XSS dialog probes).
  # Options: "auto" (on for the chromium engine, off for ungoogled/fingerprint,
  # which bring their own --fingerprint flags), "on", "off"
  # Default: auto
  stealth: auto

  # Disable CDP (Chrome DevTools Protocol) event listener detection.
  # When false (default), the crawler uses CDP to detect click handlers
  # on elements. Set to true to disable this detection.
  # Default: false
  no_cdp: false

  # Most click-listener elements the CDP listener pass turns into click
  # candidates per crawl state (document order; the rest are logged and
  # dropped). Each candidate costs several CDP round trips, so this bounds the
  # per-state cost on very large DOMs. 0 = default (2000), -1 = no cap.
  # Default: 2000
  max_listener_probe_nodes: 2000

  # Disable automatic form filling during crawling.
  # When false (default), the crawler automatically fills and submits
  # forms it encounters. Set to true to skip form interactions.
  # Legacy alias: equivalent to interaction.edit_fields and
  # interaction.submit_forms both false; an explicit interaction key wins.
  # Default: false
  no_forms: false

  # Complete a public signup form and continue the crawl as the account it
  # creates. On an application with open registration, the entire authenticated
  # surface is invisible to an unauthenticated crawl; one account converts that
  # into ordinary crawlable content. Runs at most once per host, only submits to
  # an in-scope host, and reuses the identity it creates at any later login form.
  # Off by default because registering is a write, and no intensity turns it
  # on. Legacy alias of interaction.register_account, which wins if both are set.
  # Default: false
  self_register: false

  # Largest dynamic (HTML/JS/JSON/API) response body, in encoded bytes, the
  # capture keeps. A larger response is still recorded, without its body.
  # 0 = default (16 MiB, above the API-spec ingest window); -1 = no ceiling.
  # Default: 0
  max_capture_body_bytes: 0

  # Domain of every email address the crawl generates (signup, login, plain
  # email fields). Never derived from the target, whose own domain would make
  # the address plausible real mail. A page-provided example address is still
  # preferred. Empty = example.com (RFC 2606 reserved, null MX: never delivered).
  # Default: ""
  identity_email_domain: ""

  # Fail a target's crawl instead of crawling it anonymously when configured
  # authentication (session cookies / auth headers from --auth, --auth-file,
  # -H) cannot be applied to the browser. Either way the per-target auth_state
  # (not-requested | configured | applied | failed) is reported. Auth headers
  # are only sent while the crawl is on a host the operator scope admits.
  # CLI: --require-auth. Default: false
  require_auth: false

  # What the browser crawl is permitted to change. Every key is optional: an
  # omitted key keeps its default and survives a profile/project overlay that
  # does not name it; an explicit key wins over no_forms/self_register and over
  # the intensity. The resolved policy is printed as the Spidering "Policy:" line.
  interaction:
    # Type into, toggle and select form controls. Default: true
    # edit_fields: true
    # Dispatch a form submit by any mechanism. Default: true
    # submit_forms: true
    # Attach the generated benign fixture to file inputs. Uploads are field
    # edits, so edit_fields: false withdraws them too. Default: true
    # upload_files: true
    # Let the browser save downloads. Default: false
    # download_files: false
    # Complete a public signup form. Default: false at every intensity
    # register_account: false
    # Try default credentials on a confirmed login form.
    # Default: unset = on at balanced/deep, off at quick/lite
    # login_attempts: true
    # How to answer JavaScript dialogs once recorded:
    #   record-dismiss (default) — accept alert/beforeunload, dismiss confirm/prompt
    #   accept-all               — accept everything
    # dialogs: record-dismiss

  # Browser security exceptions. Each key relaxes one Chromium boundary; every
  # key is optional. --browser-insecure turns all four on (local test apps only).
  # The effective posture is printed as the Spidering "Browser security:" line.
  browser_compat:
    # Run without the process sandbox. The sandbox is also dropped, with one
    # warning, where the host cannot provide it (root, a container, user
    # namespaces disabled) or a sandboxed launch fails on Linux. Default: false
    # no_sandbox: false
    # Accept invalid certificates, like the scanner's HTTP transport. Default: true
    # ignore_tls_errors: true
    # Let HTTPS pages load active HTTP subresources. Default: false
    # allow_insecure_content: false
    # Turn off the same-origin policy. Default: false
    # disable_web_security: false

  # Directory to write crawl graphs into: one file per crawl,
  # crawl-graph-<host>-<scan uuid>-<seq>.json, owner-only and redacted (see
  # graph_include_values). Files from older versions (version 1) are unredacted.
  # The captured traffic records what was requested; the graph records how the
  # crawler got there — which action on which state, with which form values, and
  # the selector to find that element again. That is what makes a run
  # reproducible and lets a later pass re-reach a specific state.
  # Empty disables.
  # Default: "" (disabled)
  graph_output_dir: ""

  # Keep credential-bearing values in crawl graphs: password/hidden field
  # values, credential-named fields and URL parameters, URL userinfo, element
  # value/data-* attributes. The graph records which way it was written.
  # Default: false (redacted)
  graph_include_values: false

  # Browse client-side routes found in the target's JavaScript (the jstangle
  # route facts discovery stores) as crawl entry points. The initial crawl
  # takes routes earlier runs of the project stored; the targeted re-spider
  # takes this scan's, under discovery.respider's caps. A route only the
  # router knows is otherwise invisible to an interaction crawl.
  # Default: true
  route_seeds: true

  # Route seeds one target's crawl browses, after scope filtering and dedup.
  # Each costs a navigation and a settle. 0 = default.
  # Default: 50
  max_extra_seeds: 50

# ============================================================================
# Known Issue Scan
# ============================================================================
# Run nuclei templates against in-scope targets using the nuclei Go library.
# KnownIssueScan complements Vigolium's precision scanning with nuclei's broad template
# coverage for misconfigurations, exposures, and known CVEs.
#
# Managed by scanning_strategy; override with CLI flag: --known-issue-scan
# Speed control (concurrency, rate_limit, timeout) is configured in scanning_pace.known_issue_scan.
known_issue_scan:
  # Nuclei template tags to include (empty = all templates).
  # Default: [] (run all templates)
  tags: []
  # Example: run only specific tag categories:
  # tags:
  #   - cve
  #   - misconfig
  #   - exposure

  # Nuclei template tags to exclude.
  # Default: [dos]
  exclude_tags:
    - dos

  # Filter templates by severity (empty = all severities).
  # Options: critical, high, medium, low, info
  # Default: [critical, high] at the balanced intensity — high-signal only, which
  # keeps the phase within its time budget. (The deep intensity sweeps all five.)
  # Widen to the full sweep with:
  #   vigolium config set known_issue_scan.severities "critical,high,medium,low,info"
  severities:
    - critical
    - high

  # Custom nuclei templates directory.
  # Leave empty to use the default nuclei-templates location.
  # Supports ~ expansion.
  # Default: "" (uses nuclei default templates)
  templates_dir: ""

  # Remap the severity a finding is recorded with, keyed by nuclei template ID
  # (case-insensitive). Applied after a match but before output/persistence, so the
  # stored finding, console output, and severity counts all reflect the new value.
  # Use it to right-size noisy or context-dependent templates without forking the
  # upstream template (which reverts on `nuclei -update-templates`).
  # Default: config-json-exposure-fuzz is recorded as medium — an exposed config.json
  # often ships only public base URLs / feature flags, not always-critical secrets.
  # Set an entry back to its template severity (e.g. critical) to undo a default remap.
  severity_overrides:
    config-json-exposure-fuzz: medium

  # Enrich known-issue-scan targets with paths discovered in previous phases.
  # When true, nuclei templates are run against individual path prefixes
  # found during discovery/spidering (increases coverage but can slow down scans).
  # When false, only host-level URLs are used as targets.
  # Default: true
  enrich_targets: false

# ============================================================================
# Pre-Scan External Intelligence Harvester
# ============================================================================
# Collects URLs from external intelligence sources before scanning.
# Discovered URLs are fed into the scan pipeline for vulnerability analysis.
# Managed by scanning_strategy; override with CLI flag: --external-harvest
# Timeout is configured in scanning_pace.external_harvester.max_duration.
external_harvester:
  # External sources to query for URLs.
  # Free sources (no API key): wayback, commoncrawl, alienvault, arquivo
  # Keyed sources (require api_keys): urlscan, virustotal
  # Default: [wayback, commoncrawl, alienvault, arquivo]
  #
  # wayback and commoncrawl also *mine* archived response bodies — robots.txt
  # history, sitemaps, and a bounded sample of captured HTML/JS — for endpoints
  # no CDX index records. This is on by default and bounded by fixed budgets;
  # drop the source to switch it off.
  sources:
    - wayback
    - commoncrawl
    - alienvault
    - arquivo

  # API keys for external sources that require authentication.
  # Use ${ENV_VAR} syntax to read from environment variables.
  api_keys:
    urlscan: ${URLSCAN_API_KEY}
    virustotal: ${VIRUSTOTAL_API_KEY}

  # Shaping, applied before dedup. Every harvested URL is normalized (lowercase
  # host, default port and fragment dropped, query keys sorted, utm_*/fbclid/
  # gclid/_ga/mc_* tracking params removed) and static assets (images, fonts,
  # css, media, archives) are dropped; .js and .map are kept for JS analysis.
  # URLs are then grouped by shape — host + templated path (/users/{int}) +
  # sorted query names — and sampled. 0 uses the default; -1 disables a cap.
  # Default: 3
  per_shape: 3
  # URLs kept per harvested domain after shaping.
  # Default: 5000
  max_urls: 5000

  # Wayback Machine CDX index paging (collapse=urlkey, 404s and image/font/
  # video/audio rows filtered server side, resumeKey paging).
  cdx:
    # Rows per resumeKey page. Default: 10000
    page_size: 10000
    # Hard cap on index rows read per domain; hitting it is reported as the
    # cdx_max_rows phase limit. -1 disables the cap. Default: 200000
    max_rows: 200000

  # harvest-probe: when a later phase reaches the target, check the harvested
  # URLs first — one liveness request per host, then one GET per URL — and
  # drop dead hosts, 404/410 and soft-404 answers before anything scans them.
  # Never runs on a harvest-only run, which stays target-silent.
  # false leaves every harvested URL for the later phases to fetch.
  # Default: true
  probe: true

# ============================================================================
# AI Agent Integration
# ============================================================================
# Every agent invocation is routed through the in-process olium runtime —
# there are no external subprocess backends. Configure a provider below and
# olium handles the rest.
#
# Manage agent runs at runtime:
#   POST /api/agent/run/query      — single-shot prompt execution
#   POST /api/agent/run/autopilot  — autonomous scanning session
#   GET  /api/agent/status/list    — list all runs
#   GET  /api/agent/status/:id     — check a specific run
agent:
  # Stream agent output to stdout in real-time.
  # When true (default), agent message text appears incrementally as it is produced.
  # Set to false to buffer output and display only after the agent completes.
  # Only affects CLI mode; API/server mode is unaffected.
  # Default: true
  stream: true

  # Directory containing prompt template files (.md).
  # Templates are referenced by name (filename without extension)
  # via --prompt-template flag or API prompt_template field.
  # Subdirectories are searched recursively. Built-in templates are
  # organized into sast/ (code review) and analysis/ (scan input generation).
  # Supports ~ expansion.
  # Default: ~/.vigolium/prompts/
  templates_dir: ~/.vigolium/prompts/

  # Directory for agent run session artifacts (output.txt, extensions/, plan.json).
  # Each agent run creates a subdirectory under this path.
  # Supports ~ expansion.
  # Default: ~/.vigolium/agent-sessions/
  sessions_dir: ~/.vigolium/agent-sessions/

  # --------------------------------------------------------------------------
  # browser — agent-browser integration
  # --------------------------------------------------------------------------
  # Controls whether the agent can drive a real Chromium browser via the
  # `agent-browser` CLI. When enabled, autopilot and swarm seed the session
  # dir with skills/agent-browser/SKILL.md, the autopilot system prompt
  # gains a browser-usage section, and tools like `web_fetch(mode=browser)`
  # and `browser_probe` become reachable.
  #
  # Install once with: `npm i -g agent-browser && agent-browser install`
  # Verify with: `vigolium doctor`
  browser:
    # Enable the browser surface. When false the agent still has HTTP fetches
    # via `web_fetch(mode=http)` but skips all browser-driven flows.
    # Default: true
    enable: true

    # Override the binary lookup. Empty resolves `agent-browser` on $PATH.
    # binary_path: /usr/local/bin/agent-browser

  # --------------------------------------------------------------------------
  # olium — native in-process agent
  # --------------------------------------------------------------------------
  # Settings for `vigolium agent olium` AND the JavaScript extension agent
  # API (vigolium.agent.chat / vigolium.agent.analyze). Both run through
  # the same in-process engine with unified provider support.
  olium:
    # Provider to use. Vendor-first naming — the prefix tells you which
    # credential field below applies.
    # Options:
    #   openai-codex-oauth — ChatGPT Plus/Pro subscription via OAuth json (uses oauth_cred_path)
    #   openai-api-key     — OpenAI Chat Completions API (uses llm_api_key or $OPENAI_API_KEY)
    #   openai-responses   — Public OpenAI Responses API /v1/responses (uses llm_api_key or $OPENAI_API_KEY)
    #   anthropic-api-key  — Anthropic Messages API (uses llm_api_key or $ANTHROPIC_API_KEY)
    #   anthropic-oauth    — Anthropic OAuth bearer token from `claude setup-token` (uses oauth_token or $ANTHROPIC_API_KEY)
    #   anthropic-cli      — Shells out to the local `claude` CLI (uses Claude Max sub; no key here). Alias: anthropic-claude-cli
    #   anthropic-claude-sdk-bridge — Claude Code via the Agent SDK, through the `vigolium-audit bridge`
    #                        sidecar (uses bridge_binary below, else the embedded blob, then PATH). No key —
    #                        uses your logged-in Claude Code subscription; an explicit llm_api_key/oauth_token is forwarded.
    #   anthropic-vertex   — Claude on Google Vertex AI (uses oauth_cred_path + google_cloud_project/location)
    #   google-vertex      — Gemini on Google Vertex AI (same GCP creds as anthropic-vertex)
    #   openai-compatible  — Any OpenAI Chat Completions-compatible endpoint
    #                        (Ollama, OpenRouter, LM Studio, vLLM, Together,
    #                        Groq, LocalAI, custom proxies); configured under
    #                        `custom_provider` below.
    #   anthropic-compatible — Any Anthropic Messages (/v1/messages)-compatible
    #                        endpoint at a custom base_url (self-hosted gateway
    #                        or Messages-format proxy); configured under
    #                        `custom_provider` below.
    # Default: openai-compatible (local Ollama via custom_provider below)
    provider: openai-compatible

    # Model identifier. Empty = provider default.
    # Provider defaults: openai-codex-oauth → "gpt-5.5"; openai-api-key → "gpt-5.5";
    # openai-responses → "gpt-5.5"; anthropic-api-key → "claude-opus-4-7";
    # anthropic-oauth → "claude-opus-4-7";
    # anthropic-cli → "claude-opus-4-7"; anthropic-vertex → "claude-opus-4-6";
    # anthropic-claude-sdk-bridge → bridge/Claude Code default (accepts short
    # aliases like "opus"/"sonnet" or a full model id);
    # google-vertex → "gemini-2.5-pro"; openai-compatible / anthropic-compatible
    # → uses `custom_provider.model_id` below.
    # Override per-run with --model.
    # Default: "" (empty). Leave empty so the provider default applies — for
    # openai-compatible that means custom_provider.model_id wins. Setting any
    # value here overrides custom_provider.model_id for every provider.
    model: ""

    # Path to OAuth/SA credential file. Supports ~ expansion.
    # openai-codex-oauth: ~/.codex/auth.json (produced by `codex login`)
    # anthropic-vertex / google-vertex: GCP service-account JSON
    #                    (falls back to $GOOGLE_APPLICATION_CREDENTIALS).
    # Default: ~/.codex/auth.json
    oauth_cred_path: ~/.codex/auth.json

    # Path to the `vigolium-audit` binary that hosts the SDK bridge, used only
    # by the anthropic-claude-sdk-bridge provider. Supports ~ expansion and a
    # bare command name (resolved via PATH). Leave empty to use the embedded
    # vigolium-audit blob shipped with this binary, falling back to a
    # `vigolium-audit` on PATH. Override per-run with --bridge-bin.
    # Default: "" (embedded blob, then PATH)
    bridge_binary: ""

    # Anthropic OAuth bearer token (anthropic-oauth provider). Produced by
    # `claude setup-token` — typically a `sk-ant-oat01-…` value. Supports
    # ${ENV_VAR} expansion at load time, e.g. `oauth_token: ${ANTHROPIC_API_KEY}`.
    # When empty the provider falls back to $ANTHROPIC_API_KEY (which is the
    # variable `claude setup-token` instructs you to export).
    # IMPORTANT: Never commit OAuth tokens to git — prefer the env-var form.
    # Default: ""
    oauth_token: ""

    # API key for key-based providers (anthropic-api-key, openai-api-key).
    # Supports ${ENV_VAR} expansion at load time, e.g. `llm_api_key: ${ANTHROPIC_API_KEY}`.
    # When empty the provider falls back to its conventional env var
    # (ANTHROPIC_API_KEY / OPENAI_API_KEY).
    # IMPORTANT: Never commit API keys to git — prefer the env-var form.
    # Default: ""
    llm_api_key: ""

    # Reasoning effort, forwarded to every provider that exposes the dial.
    # Options: minimal | low | medium | high | xhigh | max
    # (minimal is OpenAI-only, max is Anthropic-only; a provider that cannot
    # express the level you pick drops it rather than failing.)
    # Default: medium
    reasoning_effort: medium

    # Optional system prompt override. Empty = built-in olium prompt.
    system_prompt: ""

    # Maximum output tokens per response. Honored by the Anthropic
    # transports; other providers use their own ceiling. Reasoning tokens
    # count against this on thinking models. 0 = the provider default
    # (64000 on Anthropic); a value above the model's own cap is ignored
    # rather than sent, so the legacy 1000000 below behaves as 0.
    # Default: 0
    max_tokens: 0

    # Sampling temperature. Accepted for backward compatibility and IGNORED:
    # current Claude models reject sampling parameters outright.
    # Default: 0.0
    temperature: 0.0

    # Hard ceiling on tool-loop iterations per user prompt for short
    # non-autopilot engine uses (swarm phases, source analysis, query).
    # Autopilot does NOT use this — its ceiling is set by --max-commands
    # (CLI) / MaxCommands (API), defaulting to 100, capped internally by
    # pkg/olium/autopilot.DefaultAutopilotMaxTurns (200) when both are 0.
    # Default: 32
    max_turns: 32

    # LRU cache size for identical prompts. 0 disables caching.
    # Default: 1024
    cache_size: 1024

    # Global cap on simultaneous in-flight provider calls. 0 disables the
    # cap (unbounded — only sensible when the upstream provider has no
    # rate limit). Tightens 429 risk on tier-1 API plans.
    # Default: 4
    max_concurrent: 4

    # Per-call deadline in seconds. A hung provider stream can't pin the
    # whole phase past this. Negative = inherit only the parent context
    # (no enforced timeout).
    # Default: 600 (10 minutes)
    call_timeout_sec: 600

    # Deadline of the agent preflight ping (a one-token request sent before
    # query / triage / swarm / autopilot do any work), as a Go duration.
    # Empty = auto: 15s, or 60s when the provider is a local endpoint
    # (openai-/anthropic-compatible on loopback: Ollama, LM Studio).
    # Per-run override: --preflight-timeout; skip it with --no-preflight.
    # preflight_timeout: 15s

    # Skills always loaded in planner-filtered agentic runs (autopilot/swarm),
    # regardless of what the planner selects. General-purpose playbooks belong
    # here so filtering can never starve them. Empty = built-in default
    # [triage-finding, write-jsext]. Per-run overrides: --skill / --skill-tag /
    # --no-skill-filter. Skills live in ~/.vigolium/skills (or VIGOLIUM_SKILLS_DIR).
    # always_on_skills:
    #   - triage-finding
    #   - write-jsext

    # --------------------------------------------------------------------------
    # custom_provider — settings for provider: openai-compatible / anthropic-compatible
    # --------------------------------------------------------------------------
    # Consulted when provider is "openai-compatible" (OpenAI Chat Completions
    # wire format) or "anthropic-compatible" (Anthropic Messages /v1/messages
    # wire format). For openai-compatible, any backend that speaks Chat
    # Completions works: Ollama, OpenRouter, LM Studio, vLLM, Together, Groq,
    # LocalAI, or your own proxy. For anthropic-compatible, point base_url at a
    # self-hosted Claude gateway or a Messages-format proxy (base_url accepts a
    # /v1 root or a full /v1/messages path; extra_headers can switch the auth
    # scheme to `Authorization: Bearer`). Note: extra_body / provider_routing
    # apply to openai-compatible only.
    #
    # Examples:
    #   Ollama (local, no auth):    base_url: http://localhost:11434/v1
    #   LM Studio (local, no auth): base_url: http://localhost:1234/v1
    #   OpenRouter:                 base_url: https://openrouter.ai/api/v1
    #   Together:                   base_url: https://api.together.xyz/v1
    #   Groq:                       base_url: https://api.groq.com/openai/v1
    #
    # IMPORTANT: tool-calling depends on the model, not just the endpoint.
    # gemma4, qwen2.5-coder, llama3.1-instruct, mistral-nemo handle OpenAI-style
    # function tools well. Smaller models often ignore them and reply in
    # prose — if the agent never calls tools, switch to a tool-trained model.
    custom_provider:
      # Endpoint URL. Either the /v1 root or the full /v1/chat/completions
      # path works — the provider appends /chat/completions when needed.
      base_url: http://localhost:11434/v1

      # Default model id. Used when olium.model is empty and --model is not
      # passed. Examples: "gemma4:latest" (Ollama, default below),
      # "qwen2.5-coder:32b" (Ollama), "anthropic/claude-sonnet-4.6" (OpenRouter),
      # "meta-llama/Llama-3.1-70B-Instruct-Turbo" (Together).
      model_id: gemma4:latest

      # API key. Optional — empty disables the Authorization header entirely
      # (required for unauthenticated local servers like Ollama). Supports
      # ${ENV_VAR} expansion: api_key: ${OPENROUTER_API_KEY}.
      api_key: ""

      # Extra headers applied to every request, after the standard ones, so
      # they can override Authorization (handy for backends that use a
      # non-Bearer scheme). Each entry is a curl-style "Key: Value" string.
      # Mutate from the CLI with:
      #   vigolium config set agent.olium.custom_provider.extra_headers.clear ""
      #   vigolium config set agent.olium.custom_provider.extra_headers.add "X-Custom-Header: value"
      extra_headers: []
      #   - "X-Custom-Header: value"
      #   - "HTTP-Referer: https://your-site.example"   # OpenRouter ranking signal
      #   - "Authorization: Bearer ${MY_CUSTOM_TOKEN}"  # overrides default Bearer auth

  # --------------------------------------------------------------------------
  # Vigolium Audit Integration
  # --------------------------------------------------------------------------
  # Source security audit agent. When enabled and --source is provided,
  # swarm launches vigolium-audit in the background, while autopilot runs
  # vigolium-audit first and then starts the autonomous operator using the
  # prepared whitebox context.
  audit:
    # Enable vigolium-audit integration.
    # Default: false
    enable: true

    # Path to vigolium-audit harness directory.
    # Default: ~/.vigolium/vigolium-audit/
    # plugin_dir: ~/.vigolium/vigolium-audit/

    # Audit mode: "deep" (10-phase), "balanced" (6-phase), or "lite" (3-phase).
    # Default: balanced
    mode: balanced

    # The audit driver runs the `claude` or `codex` CLI. By default the
    # agent is resolved from `agent.olium.provider` (anthropic-* -> claude,
    # openai-* -> codex). Set `default_agent` to pin claude or codex
    # persistently without changing the olium provider (which still supplies
    # the BYOK auth) — a pure agent selector, same semantics as the per-run
    # `--agent` flag. Empty (the default) inherits the provider-derived
    # agent. Per-run `--agent`/`--provider` (CLI) and the request `agent`
    # field (REST) outrank this.
    #
    # Note: this only selects the agent — auth still follows the provider /
    # BYOK flags. Pairing default_agent with a mismatched provider (e.g.
    # default_agent: codex with an anthropic-* provider) forwards mismatched
    # creds; use a matching provider or pass per-run `--oauth-cred-file`
    # (codex) / `--api-key`. An impossible combo (codex + a claude-only
    # `--oauth-token`/anthropic-oauth) is rejected up front before any work.
    # Default: "" (inherit agent.olium.provider)
    default_agent: codex

    # Seconds between state synchronization with the parent agent.
    # Default: 30
    sync_interval: 30

# ============================================================================
# Cloud Storage Configuration
# ============================================================================
# Object storage for source code upload/download and scan result archival.
# Uses S3-compatible API (minio-go) — supports GCS (HMAC), AWS S3, and MinIO.
#
# Source paths: --source gs://<project-uuid>/ugc/source-code.zip
# Result paths: <bucket>/<project-uuid>/native-scans/<scan-uuid>/results.tar.gz
#               <bucket>/<project-uuid>/agentic-scans/<run-uuid>/results.tar.gz
#
# REST API endpoints (all project-scoped via X-Project-UUID header):
#   POST /api/storage/upload-source   — upload source code archive
#   GET  /api/storage/source/:key     — download source code
#   GET  /api/storage/results/:uuid   — download scan result bundle
#   POST /api/storage/presign         — generate presigned upload/download URL
storage:
  # Enable cloud storage integration.
  # Default: false
  enabled: false

  # Storage driver/provider.
  # Options: "gcs" (Google Cloud Storage via HMAC), "s3" (AWS S3), "minio"
  # GCS and S3 use auto-detected endpoints; minio requires an explicit endpoint.
  # Default: gcs
  driver: gcs

  # Storage endpoint (auto-detected for gcs/s3).
  # GCS: storage.googleapis.com (default)
  # S3:  s3.amazonaws.com (default)
  # MinIO: your-minio-host:9000 (required)
  # endpoint: ""

  # Bucket name for all storage operations.
  # Objects are stored as: <bucket>/<project-uuid>/<path>
  bucket: ${VIGOLIUM_STORAGE_BUCKET_NAME}

  # Bucket region.
  # Default: asia-southeast1
  region: asia-southeast1

  # S3 access key (or GCS HMAC access key).
  # Use ${ENV_VAR} syntax to read from environment variables.
  # IMPORTANT: Never commit access keys to git!
  access_key: ${VIGOLIUM_STORAGE_ACCESS_KEY}

  # S3 secret key (or GCS HMAC secret key).
  secret_key: ${VIGOLIUM_STORAGE_SECRET_KEY}

  # Use HTTPS for storage connections.
  # Default: true
  use_ssl: true

  # Force path-style addressing (required for some MinIO setups).
  # Default: false
  # path_style: false
