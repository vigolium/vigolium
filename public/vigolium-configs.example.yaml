# Vigolium Configuration File
# This is an example configuration file with all available settings.
# Copy this file to ~/.vigolium/vigolium-configs.yaml and customize as needed.
#
# Default location: ~/.vigolium/vigolium-configs.yaml
# Custom location: Use --config flag with any vigolium command

# ============================================================================
# Server Configuration
# ============================================================================
# Settings for the API server mode (vigolium server).
server:
  # API key for authenticating server requests.
  # Auto-generated on first run. Override with VIGOLIUM_API_KEY env var.
  # Clients send this in the Authorization: Bearer <key> header.
  auth_api_key: "auto-generated-on-first-run"

  # Port for the main API service.
  # Default: 9002
  service_port: 9002

  # Port for the transparent HTTP ingestion proxy.
  # Set to 0 (default) to disable. When enabled, HTTP traffic through
  # this proxy is forwarded to the original destination and recorded.
  # HTTPS CONNECT tunneling passes through without recording.
  ingest_proxy_port: 0

  # Ingest proxy bind address (empty = 127.0.0.1). A non-loopback address
  # requires ingest_proxy_token and/or ingest_proxy_allow, or the server
  # refuses to start. Same as --ingest-proxy-host.
  ingest_proxy_host: ""

  # Secret required on every proxied request as Proxy-Authorization (Basic
  # with any username and this as password, or Bearer). Same as --proxy-token.
  ingest_proxy_token: ""

  # Client CIDRs or IPs the ingest proxy accepts (empty = any). Same as
  # --proxy-allow.
  ingest_proxy_allow: []

  # CORS allowed origins for the API server.
  # Options:
  #   "reflect-origin" — echoes the requesting Origin back (allows credentials)
  #   "*"              — allow all origins (no credentials)
  #   ""               — disable CORS middleware entirely
  #   "https://app.example.com, https://admin.example.com" — comma-separated allowlist
  # Default: reflect-origin
  cors_allowed_origins: reflect-origin

  # Enable Prometheus metrics endpoint at /metrics.
  # Exposes server, queue, scan, module, and database metrics
  # in Prometheus text format for monitoring and alerting.
  # Default: true
  enable_metrics: true

  # Maximum concurrent heavy agent runs (autopilot/swarm) via the API.
  # Limits resource usage from long-running autonomous agent sessions.
  # Default: 5
  agent_heavy_max: 5

  # Maximum concurrent light agent runs (query/chat) via the API.
  # Default: 10
  agent_light_max: 10

  # Maximum time to wait for an agent slot when all slots are busy.
  # Requests that exceed this timeout receive a 429 Too Many Requests response.
  # Format: Go duration string (e.g., "30s", "1m", "5s").
  # Default: 30s
  agent_queue_timeout: 30s

  # REST response version for requests that do not negotiate one with
  # Accept: application/vnd.vigolium.v2+json, Vigolium-Api-Version: 2 or
  # ?api_version=2. 1 = historical bodies (plus error_code/schema_version),
  # 2 = the CLI envelope (items; error object with a string code).
  # Default: 1
  api_version_default: 1

  # Create the project an unknown X-Project-UUID names on first use instead
  # of answering 404 project_not_found. A client can opt in per request with
  # X-Project-Create: 1 (or ?create=1) instead.
  # Default: false
  auto_create_projects: false

  # Optional license identifier surfaced in /server-info for the UI to display
  # (e.g., "community", "enterprise", or a customer/tenant tag).
  # Leave empty to omit from the response.
  license: "open-source"

  # Mirror every ingested HTTP record and finding to a flat filesystem tree
  # under this directory (<dir>/traffic, <dir>/findings) as they are saved, in
  # addition to the database — so an external agent can read live traffic as
  # files with ls/grep/jq. Same as the --mirror-fs flag. Empty = disabled.
  mirror_fs_path: ""

# ============================================================================
# Database Configuration
# ============================================================================
# Vigolium stores HTTP requests, responses, and findings in a database
# for historical analysis, querying, and reporting.
database:
  # Enable or disable database storage
  # Default: true (enabled by default for all scans)
  enabled: true

  # Database driver to use
  # Options: "sqlite" or "postgres"
  # Default: "sqlite"
  driver: sqlite

  # SQLite Configuration (used when driver=sqlite)
  sqlite:
    # Path to SQLite database file
    # Supports ~ expansion for home directory
    # Default: ~/.vigolium/database-vgnm.sqlite
    path: ~/.vigolium/database-vgnm.sqlite

    # Busy timeout in milliseconds
    # How long to wait when database is locked
    # Default: 15000 (15 seconds)
    busy_timeout: 15000

    # Journal mode
    # Options: DELETE, TRUNCATE, PERSIST, MEMORY, WAL, OFF
    # Recommended: WAL (Write-Ahead Logging) for better concurrency
    # Default: WAL
    journal_mode: WAL

    # Synchronous mode
    # Options: OFF, NORMAL, FULL, EXTRA
    # OFF = fastest but unsafe (risk of corruption)
    # NORMAL = balanced (recommended)
    # FULL = safest but slower
    # Default: NORMAL
    synchronous: NORMAL

    # Cache size in KB (or pages if negative)
    # Larger cache = better performance for large datasets
    # Default: 10000 (10MB)
    cache_size: 10000

  # PostgreSQL Configuration (used when driver=postgres)
  postgres:
    # Database host
    # Default: localhost
    host: localhost

    # Database port
    # Default: 5432
    port: 5432

    # Database user
    # Default: vigolium
    user: vigolium

    # Database password
    # Use ${ENV_VAR} syntax to read from environment variable
    # Example: ${VIGOLIUM_DB_PASSWORD}
    # IMPORTANT: Never commit passwords to git!
    # Default: "" (empty)
    password: ""

    # Database name
    # Default: vigolium
    database: vigolium

    # SSL mode
    # Options: disable, require, verify-ca, verify-full
    # Default: disable
    sslmode: disable

    # Maximum number of open connections
    # Default: 25
    max_open_conns: 25

    # Maximum number of idle connections in pool
    # Default: 5
    max_idle_conns: 5

    # Maximum lifetime of a connection
    # Format: duration string (e.g., "5m", "1h", "30s")
    # Default: 5m
    conn_max_lifetime: 5m

# ============================================================================
# Scanning Strategy
# ============================================================================
# Named presets that control which scan phases are enabled.
# Select a strategy via --strategy flag or set the default below.
# Individual phase flags (--discover, --known-issue-scan, --external-harvest) override the strategy.
scanning_strategy:
  default_strategy: 'balanced'

  # Heuristics check level before spidering/external-harvest phases.
  # Probes root page of each CLI target to decide if spidering is worthwhile.
  #   none:     skip heuristics check
  #   basic:    check if root is blank vs content, detect JSON/XML APIs
  #   advanced: basic + SPA detection, link counting
  heuristics_check: 'basic'

  # Scanning profile preset (name from profiles_dir or path to YAML file).
  # A profile bundles strategy + pace + module selection + scope + discovery config
  # into a single file, overriding the main config when selected.
  # Use --scanning-profile flag or set here.
  # When empty, no profile is loaded and default_strategy is used as-is.
  scanning_profile: ""

  # Directory containing scanning profile YAML files.
  # Profile names correspond to filenames without the .yaml extension.
  # List available profiles with: vigolium strategy ls
  profiles_dir: ~/.vigolium/profiles/

  # --------------------------------------------------------------------------
  # Session Strategy
  # --------------------------------------------------------------------------
  # Controls how authentication sessions behave during scanning.
  # Sessions are loaded from --auth-file or --auth flags.
  # See docs/native-scan/authentication.md for the full guide.
  session:
    # Directory where session YAML files are stored.
    # When --auth-file receives a bare name (e.g. "myapp"), the scanner
    # resolves it as <session_dir>/myapp.yaml.
    # Supports ~ expansion.
    # Default: ~/.vigolium/sessions/
    session_dir: ~/.vigolium/sessions/

    # Apply primary session headers during discovery and spidering phases.
    # When true, the primary session's credentials (cookies, tokens) are
    # included in all discovery/spidering requests so authenticated content
    # is discovered.
    # When false, discovery and spidering run unauthenticated — useful for
    # mapping the public attack surface before scanning authenticated.
    # Default: true
    use_in_discovery: true

    # Enable cross-session IDOR/BOLA replay with compare sessions.
    # When true and multiple sessions are defined, the authz-compare module
    # replays primary-session requests with each compare session's credentials
    # to detect authorization bypass.
    # When false, compare sessions are ignored even if defined — use this
    # when you only need authenticated scanning without authorization testing.
    # Default: true
    compare_enabled: true

    # Defaults for each session's `check` block (a session's own value wins).
    # check.interval: proactive logged-in probe at most this often (e.g. "2m").
    reauth_interval: ""

    # check.logged_out.status: statuses that mean "logged out" (e.g. [401, 440]).
    reauth_on_status: []

    # check.url: protected URL `vigolium auth check` probes when --url is not
    # given; a path resolves against the target origin. In-scan re-login with
    # these is not enforced yet (scans log in once).
    validate_url: ""

  # --------------------------------------------------------------------------
  # Native Scan Session Logs
  # --------------------------------------------------------------------------
  # Controls on-disk persistence of raw console output for native scans.
  # Independent from the scan_logs database table — the DB always captures
  # structured entries (info/warn/error/trace) via `GET /api/scans/:uuid/logs`.
  # Enable persist_logs when you want a tail-friendly file on disk that mirrors
  # what was printed to the terminal, retrievable via `vigolium log <scan-uuid>`.
  scan_logs:
    # Directory for native scan session artifacts. Each scan creates a
    # subdirectory under this path:
    #   {sessions_dir}/{scan-uuid}/status.json   (liveness heartbeat, always)
    #   {sessions_dir}/{scan-uuid}/runtime.log   (only with persist_logs)
    # Supports ~ expansion.
    # Default: ~/.vigolium/native-sessions/
    sessions_dir: ~/.vigolium/native-sessions/

    # Mirror raw console output to {sessions_dir}/{scan-uuid}/runtime.log during
    # native scans. When false, logs are still captured in the scan_logs DB
    # table and `vigolium log <scan-uuid>` falls back to replaying DB entries.
    # Default: false
    persist_logs: false

    # Days to keep a scan's status.json heartbeat file after its last write
    # (the scan finished or died). Pruned at `vigolium server` start and by
    # `vigolium log ls --reap`; runtime.log is never touched. 0 keeps them.
    # Default: 30
    status_retention_days: 30

  # --------------------------------------------------------------------------
  # Global HTTP
  # --------------------------------------------------------------------------
  # Outbound-HTTP settings applied across every scan phase that sends requests
  # (dynamic-assessment, content discovery, 404 fingerprinting, Wayback
  # harvesting). The browser-driven spidering phase uses its native Chromium
  # User-Agent and is not affected.
  http:
    # User-Agent header sent on every outgoing scanner request (modules that
    # deliberately inject their own User-Agent — e.g. header-injection probes —
    # keep theirs). Accepted values:
    #   preset  -> "Mozilla/5.0 (compatible; Vigolium/{version}; +https://github.com/vigolium/vigolium)"
    #              the honest, self-identifying default. {version} is replaced
    #              with the running binary version, so it stays correct across
    #              upgrades.
    #   random  -> rotate a realistic browser User-Agent per request.
    #   ""      -> blank behaves exactly like "random".
    #   <any>   -> use the literal string verbatim ({version} still expands).
    # An explicit `-H 'User-Agent: ...'` CLI flag still overrides this for the
    # dynamic-assessment phase, and the VIGOLIUM_DEFAULT_UA env var overrides
    # this config value when set. Set with:
    #   vigolium config set scanning_strategy.http.user_agent preset
    #   vigolium config set scanning_strategy.http.user_agent random
    # ...or as a one-off, without touching this file:
    #   export VIGOLIUM_DEFAULT_UA=random
    #
    # @NOTE: Yes, "preset" waves a tiny flag that says "hi, it's me, Vigolium" on
    # every request, and that's on purpose. We'd rather the blue team spot us in
    # the logs in 5 seconds than spend their evening chasing a "mystery actor"
    # that turns out to be... their own authorized scan. If you want to go full
    # ninja, flip it to "random", but then you also own the incident bridge at
    # 3am. And if any of this surprised you, that's a gentle hint to go read the
    # docs (we promise they're good): https://docs.vigolium.com/
    user_agent: "preset"

    # Dead-host breaker. A host:port that hits --max-host-error consecutive
    # transport errors (refused, reset, DNS, i/o timeout) is quarantined for
    # `cooldown`; then one probe request is let through. A good probe restores
    # the host; a failed one doubles the cooldown (capped at `max_cooldown`).
    # After `max_trips` failed probes the host is skipped for the rest of the
    # scan (negative = never give up). Items skipped meanwhile are reported as
    # skipped_quarantined / targets_unreachable.
    host_errors:
      cooldown: 30s
      max_cooldown: 5m
      max_trips: 5

  lite:
    external_harvesting: false
    discovery: false
    spidering: false
    known_issue_scan: false
    dynamic-assessment: true

  balanced:
    external_harvesting: false
    discovery: true
    spidering: true
    known_issue_scan: true
    dynamic-assessment: true

  deep:
    external_harvesting: true
    discovery: true
    spidering: true
    known_issue_scan: true
    dynamic-assessment: true

# ============================================================================
# Scanning Pace (Speed Control)
# ============================================================================
# Centralized speed control parameters. Common values serve as baseline
# for all phases; per-phase subsections override specific values.
#
# Precedence (highest to lowest):
#   1. CLI flags (-c, --max-per-host, --scanning-max-duration, --discover-max-time)
#   2. scanning_pace per-phase overrides
#   3. scanning_pace common values
#   4. Built-in defaults
scanning_pace:
  ## Common defaults (inherited by all phases unless overridden)
  concurrency: 25        # Worker/thread count
  rate_limit: 100        # Requests/sec (applies to KnownIssueScan currently)
  max_per_host: 40        # Per-host concurrency cap
  max_duration: 1h       # Base duration for all phases (per-phase factors scale this)
  max_requests: 0        # Stop the scan after N requests to the targets (0 = unlimited; --max-requests)
  max_requests_per_host: 0  # At most N requests to any one target host (0 = unlimited; --max-requests-per-host)
  # NOTE: the --scanning-max-duration CLI flag additionally caps TOTAL scan
  # wall-clock time (all phases combined) at the value passed, so multi-phase
  # scans can't run past it; the per-phase factors then distribute that budget
  # across phases instead of stacking sequentially. The YAML max_duration above
  # is only the per-phase base and does not impose a total cap on its own.

  # Per-phase overrides (only set fields override common values)
  # Factors scale the common value (e.g. duration_factor: 2.0 = 2x base max_duration).
  # Explicit values always take priority over factors.
  discovery:
  #   concurrency: 30
  #   concurrency_factor: 0.6     # alternative: 60% of common concurrency
  #   max_duration: 1h
    duration_factor: 0.5          # 0.5x base → 22m30s
  known_issue_scan:
    duration_factor: 0.5          # 0.5x base → 30m
  spidering:
    duration_factor: 0.1          # 0.1x base → 4m30s
  external_harvester:
    duration_factor: 0.1          # 0.1x base → 4m30s
  dynamic-assessment:
    duration_factor: 1.0          # 1x base → 45m
    # Per-call cap on a single active-module scan of one record/insertion point.
    # When the phase max_duration fires, this also unblocks every in-flight
    # active module so the phase stops on time instead of overrunning. Slow
    # modules (e.g. smart-behavior-detection) raise their own bound internally
    # via TimeoutHinter. Built-in default is 5m; lower it for faster scans.
    active_module_timeout: 5m

# ============================================================================
# Notification Configuration
# ============================================================================
# Configure notifications for scan findings and scan completion.
# Supports three channels:
#   - telegram: per-finding messages (severity-filtered)
#   - discord:  per-finding messages (severity-filtered)
#   - webhook:  one POST per scan when it reaches a terminal state
#               (completed/failed) — independent of severity. Best configured
#               per-project at ~/.vigolium/projects/<uuid>/config.yaml so each
#               project can post to its own endpoint.
# Use ${ENV_VAR} syntax to read secrets from environment variables.
notify:
  # Enable or disable notifications (master switch).
  # Default: false
  enabled: false

  # Provider selector: pick ONE channel as the active provider.
  # Options:
  #   webhook   → fire only the scan-completion webhook
  #   telegram  → fire only per-finding telegram messages
  #   discord   → fire only per-finding discord messages
  #   ""        → any configured provider fires (telegram + discord both
  #                emit per-finding; webhook emits on completion). This is
  #                the backward-compatible default.
  # Default: ""
  provider: ""

  # Severity levels to notify on (telegram/discord only — the webhook always
  # fires on completion regardless of severity).
  # Options: critical, high, medium, low, info, all
  # Default: [high, critical, medium]
  severities:
    - high
    - critical
    - medium

  # Telegram notification settings (per-finding).
  telegram:
    # Bot token (or set TELEGRAM_BOT_TOKEN env)
    bot_token: ${TELEGRAM_BOT_TOKEN}
    # Chat ID (or set TELEGRAM_CHAT_ID env)
    chat_id: ${TELEGRAM_CHAT_ID}

  # Discord notification settings (per-finding).
  discord:
    # Webhook URL (or set DISCORD_WEBHOOK_URL env)
    webhook_url: ${DISCORD_WEBHOOK_URL}

  # Webhook on scan completion (one POST per scan when it completes, fails or
  # is cancelled; retried up to 5 times on 5xx + network errors with
  # exponential backoff). The body includes event (scan.completed |
  # scan.failed | scan.cancelled), project_uuid, scan_uuid, scan_type, target,
  # status, completeness, stop_reason, started_at, finished_at, severity
  # counts, and the storage URL of the result bundle (when --upload-results
  # was used). See docs/configuration.md for the full payload schema.
  webhook:
    # Endpoint that receives the POST. Empty disables the webhook.
    url: ""
    # Raw value sent in the Authorization header (e.g. "Bearer <token>" or
    # "Basic <b64>"). Leave empty to send no Authorization header.
    authorization: ""
    # Per-request HTTP timeout in seconds. Default: 10.
    timeout_sec: 10
    # Outcomes that POST: completed, failed, cancelled.
    # Default: all three
    # events: [completed, failed, cancelled]

# ============================================================================
# Dynamic Assessment Configuration
# ============================================================================
# Settings for the dynamic-assessment scan phase (Phase 4): which scanner
# modules are enabled and JavaScript extension configuration.
dynamic-assessment:
  # Maximum feedback rounds (re-scanning newly discovered URLs).
  # Default: 1
  max_feedback_rounds: 1

  # Maximum findings emitted per module before suppression is set with the CLI
  # flag --max-findings-per-module (default 10, 0 = unlimited). There is no
  # config key for it: one lived here as `max_findings_per_module: 15`, which
  # matched no struct field, so it was silently inert AND documented a default
  # the CLI does not use.

  # --------------------------------------------------------------------------
  # Enabled Modules
  # --------------------------------------------------------------------------
  # Control which scanner modules are loaded when scanning with "-m all" (the default).
  # Use ["all"] to enable every registered module, or list specific module IDs.
  # Explicit CLI selection (e.g. "-m sqli,xss") always overrides this setting.
  #
  # Run "vigolium module ls" to see all available module IDs.
  enabled_modules:
    # Active (fuzzing) modules to load
    # Default: [all]
    active_modules:
      - all
    # Passive (observation) modules to load
    # Default: [all]
    passive_modules:
      - all
    # Example: run only specific active modules while keeping all passive modules:
    # active_modules:
    #   - sqli-error-based
    #   - xss-reflected-brutelogic
    # passive_modules:
    #   - all

  # --------------------------------------------------------------------------
  # JavaScript Extensions
  # --------------------------------------------------------------------------
  # Load JavaScript-based extensions for custom active/passive modules
  # and pre/post hooks. Powered by goja (ES5.1 compatible).
  extensions:
    # Enable or disable JS extensions
    # Default: false
    enabled: false

    # Directory to scan for .js extension files
    # Default: ~/.vigolium/extensions/
    extension_dir: ~/.vigolium/extensions/

    # Explicit script paths (in addition to extension_dir)
    custom_dir: []

    # User-defined variables accessible as vigolium.config.* in scripts
    variables: {}
      # collaborator_domain: "collab.example.com"
      # api_key: "${MY_API_KEY}"

    # Resource limits for script execution
    limits:
      # Maximum execution time per script invocation
      # Default: 30s
      timeout: 30s

    # Let vigolium.http.* reach hosts outside the scan scope. Extension HTTP is
    # scope-checked like module traffic by default.
    # Default: false
    allow_out_of_scope: false

# ============================================================================
# OAST (Out-of-Band Application Security Testing)
# ============================================================================
# Detects blind vulnerabilities (SSRF, XXE, RCE, etc.) by injecting callback
# URLs that phone home when triggered. Uses an interactsh server to receive
# DNS/HTTP/SMTP interactions from the target.
#
# Works out of the box with the public oast.pro server — no setup needed.
# For private/self-hosted interactsh servers, set server_url and token.
oast:
  # Enable OAST callback detection during active scanning.
  # When enabled, modules that support blind testing (e.g. oast-probe, ssrf-detection)
  # will inject callback URLs and listen for out-of-band interactions.
  # Default: true
  enabled: true

  # Interactsh server URL for receiving callbacks.
  # The public "oast.pro" server works without authentication.
  # For private deployments: "your-interactsh.company.com"
  # Supports ${VAR:-default} syntax for environment variable expansion.
  # Default: oast.pro
  server_url: ${VIGOLIUM_OAST_DOMAIN:-oast.pro}

  # Authentication token for private interactsh servers.
  # Not required for the public oast.pro server.
  # Supports ${VAR:-default} syntax for environment variable expansion.
  # Default: "" (no auth)
  token: ${VIGOLIUM_OAST_TOKEN:-}

  # Re-register against the default "oast.pro" when server_url does not answer.
  # A misspelled, retired or unreachable server_url otherwise costs the scan
  # every blind/out-of-band check while it still reports "completed" with an
  # empty findings list - which reads exactly like a clean target. The token is
  # NOT carried to the fallback: it belongs to the server you named.
  # Set false where a callback may not reach a third party. An out-of-band
  # callback carries whatever the payload pulled out of the target (an internal
  # hostname, a header, a token), so on an engagement whose authorization names
  # the collector, falling back to a public server is unapproved egress.
  # Default: false
  fallback_to_default: false

  # Seconds between polling the interactsh server for new interactions.
  # Lower values detect callbacks faster but generate more traffic.
  # Default: 5
  poll_interval: 5

  # Seconds to keep polling after the scan ends, catching late callbacks.
  # Some blind vulnerabilities trigger delayed interactions (async jobs,
  # queued emails, cron tasks). Increase for targets with known async processing.
  # Default: 10
  grace_period: 10

  # Keep the interactsh session open when a scan ends (stored in the database,
  # key material redacted from exports) so callbacks that arrive later - a blind
  # XSS rendered next week, a queued job - are still collected by
  # `vigolium oast poll` or the server's periodic poller. Never applies to -S.
  # Default: true
  keep_session: true

  # Minutes between `vigolium server` polls of kept sessions (0 disables).
  # Default: 5
  session_poll_interval: 5

  # Fixed OAST callback URL. When set, all OAST modules use this URL
  # instead of auto-generating unique URLs via interactsh.
  # Useful for custom callback servers or manual testing.
  # Default: "" (auto-generate via interactsh)
  oast_url: ""

  # Enable blind XSS detection during active scanning.
  # When enabled, modules will inject <script src="..."> payloads
  # using the blind_xss_src URL to detect stored/blind XSS.
  # Default: false
  enabled_blind_xss: false

  # JavaScript payload URL for blind XSS detection.
  # This URL is injected as <script src="..."> in parameters.
  # Use a service like xsshunter or your own callback server.
  # Default: "" (no blind XSS probing)
  blind_xss_src: ""

# ============================================================================
# Mutation Strategy Configuration
# ============================================================================
# Controls how request values are mutated during scanning and what default
# values to use per field type when OpenAPI specs lack examples.
mutation_strategy:
  # Mutation modes to apply for payloads.
  # Each request is scanned once per mode, so more modes = more thorough but slower.
  # Options: "replace", "append", "prepend"
  # Default: ["append"]
  default_modes:
    - append
  # Example: scan with both append and replace strategies:
  # default_modes:
  #   - append
  #   - replace

  # Default example values per field type.
  # Used by the OpenAPI parser when specs lack examples for parameters/fields.
  # The first value in each list is used as the primary example.
  field_type_defaults:
    string:
      - "test"
      - "example"
      - "sample"
    slug:
      - "test-slug"
      - "example-item"
      - "sample-post"
    json:
      - '{"key":"value"}'
      - '{"test":true}'
      - '{"id":123}'
    "null":
      - "null"
      - ""
      - "nil"
    date:
      - "2026-02-16"
      - "2026-01-01"
      - "2025-12-31"
    datetime:
      - "2026-02-16T03:00:00Z"
      - "2026-01-01T00:00:00Z"
      - "2025-12-31T23:59:59Z"
    number:
      - "123"
      - "456.789"
      - "0"
    float:
      - "123.45"
      - "0.001"
      - "999.99"
    integer:
      - "1"
      - "100"
      - "999"
    long:
      - "9223372036854775807"
      - "1000000"
      - "42"
